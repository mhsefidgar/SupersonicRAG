[workspace]
resolver = "2"
members = [
  "apps/api",
  "apps/worker",
  "crates/rag-core",
  "crates/retrieval",
  "crates/evaluation",
  "crates/tenancy",
  "crates/security",
  "crates/ingestion"
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
