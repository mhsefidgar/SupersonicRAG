services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: swiftrag
      POSTGRES_USER: swiftrag
      POSTGRES_PASSWORD: swiftrag_dev
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant_data:/qdrant/storage"]

  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    environment:
      DATABASE_URL: postgres://swiftrag:swiftrag_dev@postgres:5432/swiftrag
      QDRANT_URL: http://qdrant:6333
      SWIFTRAG_CONFIG: /app/config/swiftrag.example.yaml
    ports: ["8080:8080"]
    depends_on: [postgres, qdrant]

  admin:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.admin
    environment:
      VITE_API_URL: http://localhost:8080
    ports: ["3000:80"]
    depends_on: [api]

volumes:
  postgres_data:
  qdrant_data:
