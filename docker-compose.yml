services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: supersonicrag
      POSTGRES_USER: supersonicrag
      POSTGRES_PASSWORD: supersonicrag_dev
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supersonicrag -d supersonicrag"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.15.5
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant_data:/qdrant/storage"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/readyz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    environment:
      DATABASE_URL: postgres://supersonicrag:supersonicrag_dev@postgres:5432/supersonicrag
      QDRANT_URL: http://qdrant:6333
      SUPERSONICRAG_STORAGE_DIR: /data/knowledge
    ports: ["8080:8080"]
    volumes:
      - knowledge_data:/data/knowledge
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.admin
    ports: ["3000:80"]
    depends_on: [api]

volumes:
  postgres_data:
  qdrant_data:
  knowledge_data:
